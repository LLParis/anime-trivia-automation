[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-trivia-automation"
version = "0.10.1"
description = "GPU-first Windows desktop automation for Anime Soul trivia cards"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "dxcam==0.3.0",
  "paddleocr==3.7.0",
  "paddlex[ocr-core]==3.7.2",
  "numpy>=1.24,<2.4",
  "opencv-contrib-python==4.10.0.84",
  "ImageHash==4.3.2",
  "Pillow>=11.3,<13",
  "rapidfuzz==3.14.6",
  "pynput==1.8.2",
  "comtypes==1.4.16",
  "transformers==5.16.1",
  "accelerate==1.14.0",
  "bitsandbytes==0.50.2",
  "google-genai==2.21.0",
]

[project.scripts]
anime-trivia = "anime_trivia_automation.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
